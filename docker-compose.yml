services:
  # --------------------------------------------------------------------------
  # SERVICES
  # --------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      args:
        NGINX_VERSION: ${NGINX_VERSION}
    image: ${CONTAINER_PREFIX:-app_laravel}-web:${WEB_IMAGE_TAG:-alpha-1}
    container_name: ${CONTAINER_WEB_NAME}
    ports:
      - "${APP_PORT}:80"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      CONTAINER_APP_NAME: ${CONTAINER_APP_NAME}
    volumes:
      - .:/var/www/html
    depends_on:
      - app
    networks:
      - app_network

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION}
    image: ${CONTAINER_PREFIX:-app_laravel}-app:${APP_IMAGE_TAG:-alpha-1}
    container_name: ${CONTAINER_APP_NAME}
    working_dir: /var/www/html/src
    volumes:
      - .:/var/www/html
    networks:
      - app_network

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION}
    image: ${CONTAINER_PREFIX:-app_laravel}-node:${NODE_IMAGE_TAG:-alpha-1}
    container_name: ${CONTAINER_NODE_NAME}
    working_dir: /var/www/html/src
    tty: true
    volumes:
      - .:/var/www/html
      - /var/www/html/src/node_modules
    command: tail -f /dev/null
    networks:
      - app_network

  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION}
    container_name: ${CONTAINER_MAIL_NAME}
    ports:
      - "${MAILPIT_UI_PORT}:8025"
      - "${MAILPIT_SMTP_PORT}:1025"
    networks:
      - app_network

  # --------------------------------------------------------------------------
  # POSTGRESQL + PGADMIN
  # --------------------------------------------------------------------------
  db_postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION:-14.24-alpine3.23}
    image: ${CONTAINER_PREFIX:-app_laravel}-db_postgres:${DB_IMAGE_TAG:-alpha-1}
    container_name: ${CONTAINER_PREFIX}_postgres
    ports:
      - "${DB_PORT_FORWARD}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION}
    container_name: ${CONTAINER_DB_MANAGER_NAME}
    user: root
    ports:
      - "${DB_MANAGER_PORT}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${DB_USER_PASSWORD}
      PGADMIN_DEFAULT_PASSWORD: ${DB_ROOT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      APP_NAME: ${APP_NAME}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PORT: ${DB_PORT:-5432}
    volumes:
      - ./docker/pgadmin/setup-servers.sh:/setup-servers.sh:ro
    entrypoint: ["/bin/sh", "/setup-servers.sh"]
    depends_on:
      - db_postgres
    networks:
      - app_network

  # --------------------------------------------------------------------------
  # NODE / VITE SERVICE (Build + Dev Server)
  # --------------------------------------------------------------------------
  vite:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION}
    image: ${CONTAINER_PREFIX:-app_laravel}-vite:${VITE_IMAGE_TAG:-alpha-1}
    container_name: ${CONTAINER_PREFIX}_vite
    working_dir: /var/www/html/src
    tty: true
    ports:
      - "${VITE_PORT}:5173"
    volumes:
      - .:/var/www/html
      - /var/www/html/src/node_modules
    command: sh -c "npm install && npm run build && npm run dev -- --host 0.0.0.0"
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local